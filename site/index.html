<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Přehled mých aktivit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0d5f5f; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .cell { width: 14px; height: 14px; border-radius: 2px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255, 255, 255, 0.8); }
    .cell:hover { transform: scale(1.3); opacity: 1 !important; }
    .activity-menu { position: fixed; background: #0f3a3a; border: 1px solid #1a5a5a; border-radius: 8px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .activity-menu-item { padding: 10px 16px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #334155; }
    .activity-menu-item:last-child { border-bottom: none; }
    .activity-menu-item:hover { background: #334155; }
    .progress-bar-inner { transition: width 1s ease; }
    /* Sloupec = týden, řádek = den; prázdná místa drží zarovnání */
    .month-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); grid-auto-columns: 14px; gap: 2px; }
    .cell-gap { width: 14px; height: 14px; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-6xl mx-auto">
    <header class="mb-8 pb-6 border-b border-teal-700 flex items-start justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-4xl font-bold text-white mb-2">Activity Heatmaps</h1>
        <p class="text-slate-200">Přehled mých aktivit</p>
      </div>
      <div class="bg-teal-900 border border-teal-700 rounded-lg px-4 py-3 text-right">
        <p class="text-xs text-slate-200 uppercase mb-1">🏔️ Celkové převýšení</p>
        <p class="text-2xl font-bold text-amber-400" id="totalElevAll">—</p>
        <p class="text-xs text-slate-300" id="everestCount">— výstupů na Everest</p>
      </div>
    </header>

    <!-- CÍL -->
    <div id="goalContainer"></div>

    <!-- FILTRY -->
    <aside class="mb-8 p-4 bg-teal-900 rounded-lg border border-teal-700">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div>
          <h2 class="text-sm font-semibold text-slate-200 uppercase mb-3">Roky</h2>
          <div id="yearFilter" class="flex flex-wrap gap-2"></div>
        </div>
        <div class="md:col-span-2">
          <h2 class="text-sm font-semibold text-slate-200 uppercase mb-3">Aktivita</h2>
          <div id="typeFilter" class="flex flex-wrap gap-2"></div>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-200 uppercase mb-3">Akce</h2>
          <div class="flex flex-col gap-2">
            <div class="flex rounded overflow-hidden border border-teal-600" role="group" aria-label="Zobrazení dnů">
              <button id="showAllBtn" class="flex-1 px-2 py-2 text-sm font-medium bg-cyan-600 text-white" aria-pressed="true">Všechny dny</button>
              <button id="showActiveBtn" class="flex-1 px-2 py-2 text-sm font-medium bg-teal-700 text-slate-200" aria-pressed="false">Dny s aktivitou</button>
            </div>
            <button id="resetBtn" class="px-4 py-2 bg-red-900 text-red-100 rounded hover:bg-red-800 text-sm font-medium">
              Reset
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- STATISTIKY -->
    <div id="statsContainer" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>

    <!-- EXTRA METRIKY -->
    <div id="extraMetrics" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"></div>

    <!-- GRAFY -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div class="bg-teal-900 rounded-lg border border-teal-700 p-4">
        <h2 class="text-sm font-semibold text-slate-200 uppercase mb-4">📅 Aktivní dny dle měsíce</h2>
        <div id="monthBarChart" style="height:88px;display:flex;align-items:flex-end;gap:4px;"></div>
        <div id="monthLabels" style="display:flex;gap:4px;margin-top:4px;"></div>
      </div>
      <div class="bg-teal-900 rounded-lg border border-teal-700 p-4">
        <h2 class="text-sm font-semibold text-slate-200 uppercase mb-4">📆 Aktivní dny dle dne v týdnu</h2>
        <div id="weekdayBarChart" style="height:88px;display:flex;align-items:flex-end;gap:4px;"></div>
        <div id="weekdayLabels" style="display:flex;gap:4px;margin-top:4px;"></div>
      </div>
    </div>

    <!-- HEATMAPY -->
    <div id="legendContainer" class="flex flex-wrap gap-x-4 gap-y-2 mb-6 text-xs text-slate-100"></div>
    <div id="heatmapsContainer" class="space-y-8"></div>

    <!-- FOOTER -->
    <footer class="text-center text-sm text-slate-100 py-8 border-t border-teal-700 mt-12">
      Powered by <a href="https://github.com/aspain/git-sweaty" class="text-cyan-400 hover:text-cyan-300">git-sweaty</a>
      <p id="updatedAt" class="mt-2 text-slate-200"></p>
    </footer>
  </div>

  <script>
    let allData = {};
    let selectedYears = new Set();
    let selectedTypes = new Set();
    let showAllDays = true;

    const CYCLING_TYPES = ['Ride', 'VirtualRide', 'GravelRide', 'MountainBikeRide', 'EBikeRide'];
    // Roční cíle v km (počítají se jen cyklistické aktivity)
    const GOALS = { 2026: 8000, 2027: 8088 };
    const MONTHS = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
    const WEEKDAYS = ['Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota', 'Neděle'];
    const TYPE_NAMES = {
      AlpineSki: 'Sjezdové lyže', BackcountrySki: 'Skialpy', Canoeing: 'Kanoe', Crossfit: 'CrossFit',
      EBikeRide: 'Elektrokolo', Elliptical: 'Eliptický trenažér', GravelRide: 'Gravel', Hike: 'Turistika',
      IceSkate: 'Bruslení', InlineSkate: 'Kolečkové brusle', Kayaking: 'Kajak', MountainBikeRide: 'Horské kolo',
      NordicSki: 'Běžky', Pilates: 'Pilates', Ride: 'Kolo', RockClimbing: 'Lezení', Rowing: 'Veslování',
      Run: 'Běh', Snowboard: 'Snowboard', Snowshoe: 'Sněžnice', StandUpPaddling: 'Paddleboard', Swim: 'Plavání',
      TrailRun: 'Trailový běh', VirtualRide: 'Virtuální jízda', VirtualRun: 'Virtuální běh', Walk: 'Chůze',
      WeightTraining: 'Posilování', Workout: 'Cvičení', Yoga: 'Jóga'
    };

    const typeName = type => TYPE_NAMES[type] || type;
    const typeColor = type => allData.type_meta[type]?.accent || '#6b7280';
    const formatNumber = value => Math.round(value).toLocaleString('cs-CZ');
    const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);

    // '2026-02-01' → '1. 2. 2026'
    function formatDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return d + '. ' + m + '. ' + y;
    }

    function goalStatus(year, doneKm, now) {
      const goal = GOALS[year];
      const dayNumber = date => Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000;
      const first = dayNumber(new Date(year, 0, 1));
      const daysInYear = dayNumber(new Date(year + 1, 0, 1)) - first;
      const daysElapsed = dayNumber(now) - first;
      const daysLeft = daysInYear - daysElapsed; // včetně dneška, 31. 12. = 1
      const remaining = Math.max(0, goal - doneKm);
      return {
        goal, daysLeft, remaining,
        dailyNeeded: remaining / daysLeft,
        percentage: doneKm >= goal ? 100 : Math.min(Math.round(doneKm / goal * 100), 99),
        shouldHave: Math.round(daysElapsed * (goal / daysInYear))
      };
    }

    function renderGoal() {
      const now = new Date();
      const year = now.getFullYear();
      const container = document.getElementById('goalContainer');
      if (!GOALS[year]) { container.innerHTML = ''; return; }

      const done = sumAggregates([year], new Set(CYCLING_TYPES)).distance / 1000;
      const g = goalStatus(year, done, now);
      const diff = Math.round(done) - g.shouldHave;
      const diffColor = diff >= 0 ? 'text-green-400' : 'text-red-400';
      const daily = g.remaining > 0 ? formatDecimal(g.dailyNeeded) + ' km' : 'Splněno 🎉';

      container.innerHTML = `
        <div class="bg-teal-800 p-4 rounded-xl border border-teal-600 mb-8">
          <h2 class="text-slate-200 text-xs uppercase mb-3">🎯 Cíl ${year}: ${formatNumber(g.goal)} km na kole</h2>
          <div class="w-full bg-teal-700 rounded-full h-4 overflow-hidden mb-3">
            <div class="progress-bar-inner bg-gradient-to-r from-cyan-500 to-green-500 h-full rounded-full" style="width:${g.percentage}%"></div>
          </div>
          <div class="grid grid-cols-3 gap-4 mb-4">
            <div>
              <p class="text-xs text-slate-100 mb-1">Postup</p>
              <p class="text-2xl font-bold text-cyan-400">${formatNumber(done)} km</p>
              <p class="text-xs text-slate-200 mt-1">${g.percentage} % hotovo</p>
            </div>
            <div>
              <p class="text-xs text-slate-100 mb-1">Zbývá</p>
              <p class="text-2xl font-bold ${g.remaining > 0 ? 'text-amber-400' : 'text-green-400'}">${formatNumber(g.remaining)} km</p>
              <p class="text-xs text-slate-200 mt-1">${g.daysLeft} ${plural(g.daysLeft, 'den', 'dny', 'dní')} včetně dneška</p>
            </div>
            <div>
              <p class="text-xs text-slate-100 mb-1">Denní průměr</p>
              <p class="text-2xl font-bold text-green-400">${daily}</p>
              <p class="text-xs text-slate-200 mt-1">do cíle</p>
            </div>
          </div>
          <div class="border-t border-teal-600 pt-3">
            <p class="text-xs text-slate-100 mb-2 uppercase">Průběžný cíl (dnes)</p>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <p class="text-xs text-slate-100 mb-1">Měl bych mít</p>
                <p class="text-lg font-bold text-cyan-400">${formatNumber(g.shouldHave)} km</p>
              </div>
              <div>
                <p class="text-xs text-slate-100 mb-1">Mám</p>
                <p class="text-lg font-bold ${diffColor}">${formatNumber(done)} km</p>
                <p class="text-xs ${diffColor} mt-1">${diff >= 0 ? '+' : ''}${formatNumber(diff)} km</p>
              </div>
            </div>
          </div>
        </div>`;
    }

    // Výsledek cíle u uzavřeného roku
    function pastGoalHtml(year) {
      if (!GOALS[year] || year >= new Date().getFullYear()) return '';
      const done = sumAggregates([year], new Set(CYCLING_TYPES)).distance / 1000;
      const result = done >= GOALS[year]
        ? 'splněn (' + formatNumber(done) + ' km)'
        : 'nesplněn (' + formatNumber(done) + ' km)';
      return '<p class="text-sm text-slate-100 mb-4">🎯 Cíl ' + formatNumber(GOALS[year]) + ' km na kole: ' + result + '</p>';
    }

    function renderLegend() {
      const used = new Set(allData.activities
        .filter(a => selectedYears.has(a.year) && selectedTypes.has(a.type))
        .map(a => a.type));
      document.getElementById('legendContainer').innerHTML = allData.types.filter(t => used.has(t)).map(type =>
        '<span class="flex items-center gap-1"><span class="cell-gap rounded-sm" style="background:' + typeColor(type) + '"></span>' + typeName(type) + '</span>'
      ).join('');
    }

    function renderUpdatedAt() {
      if (!allData.generated_at) return;
      const when = new Date(allData.generated_at);
      document.getElementById('updatedAt').textContent = 'Data aktualizována ' + when.toLocaleDateString('cs-CZ') +
        ' v ' + when.toLocaleTimeString('cs-CZ', { hour: 'numeric', minute: '2-digit' });
    }


    async function init() {
      const res = await fetch('data.json');
      allData = await res.json();
      
      selectedYears = new Set(allData.years);
      
      // Výchozí: pouze cyklistické aktivity
      selectedTypes = new Set(allData.types.filter(t => CYCLING_TYPES.includes(t)));
      
      renderFilters();
      render();
      renderEverestBadge();
      renderGoal();
      renderUpdatedAt();
    }

    // Agregát je po dni a typu, proto se sčítá přímo přes aggregates, ne přes activities
    function sumAggregates(years, types) {
      const total = { count: 0, distance: 0, elevation_gain: 0, moving_time: 0 };
      years.forEach(year => {
        Object.entries(allData.aggregates[String(year)] || {}).forEach(([type, dates]) => {
          if (!types.has(type)) return;
          Object.values(dates).forEach(day => {
            Object.keys(total).forEach(key => total[key] += day[key] || 0);
          });
        });
      });
      return total;
    }

    function formatDecimal(value) {
      return value.toLocaleString('cs-CZ', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function renderEverestBadge() {
      const totalElev = sumAggregates(allData.years, new Set(allData.types)).elevation_gain;
      document.getElementById('totalElevAll').textContent = Math.round(totalElev).toLocaleString('cs-CZ') + ' m';
      document.getElementById('everestCount').textContent = Math.round(totalElev / 8849).toLocaleString('cs-CZ') + '× výstup na Everest';
    }

    function renderFilters() {
      const yearContainer = document.getElementById('yearFilter');
      yearContainer.innerHTML = allData.years.map(year => `
        <button class="year-btn px-3 py-1 rounded text-sm font-medium transition
          ${selectedYears.has(year) ? 'bg-cyan-600 text-white' : 'bg-teal-700 text-slate-200 hover:bg-teal-600'}"
          data-year="${year}">${year}</button>
      `).join('');
      
      yearContainer.querySelectorAll('.year-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const year = parseInt(e.target.dataset.year);
          selectedYears.has(year) ? selectedYears.delete(year) : selectedYears.add(year);
          renderFilters();
          render();
        });
      });

      const typeContainer = document.getElementById('typeFilter');
      typeContainer.innerHTML = allData.types.map(type => {
        const color = allData.type_meta[type]?.accent || '#6b7280';
        const isSelected = selectedTypes.has(type);
        return `
          <button class="type-btn px-2 py-1 rounded text-xs font-medium transition flex items-center gap-1"
            data-type="${type}" 
            style="${isSelected 
              ? `background-color: ${color}40; border: 2px solid ${color}; color: ${color}; font-weight: bold;` 
              : `background-color: transparent; border: 1px solid #475569; color: #64748b; opacity: 0.5;`}">
            ● ${typeName(type)}
          </button>
        `;
      }).join('');

      typeContainer.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const type = e.target.closest('.type-btn').dataset.type;
          selectedTypes.has(type) ? selectedTypes.delete(type) : selectedTypes.add(type);
          renderFilters();
          render();
        });
      });

      document.getElementById('resetBtn').onclick = () => {
        selectedYears = new Set(allData.years);
        selectedTypes = new Set(allData.types.filter(t => CYCLING_TYPES.includes(t)));
        renderFilters();
        render();
      };

      document.getElementById('showAllBtn').onclick = () => setShowAllDays(true);
      document.getElementById('showActiveBtn').onclick = () => setShowAllDays(false);
    }

    function setShowAllDays(value) {
      showAllDays = value;
      [['showAllBtn', value], ['showActiveBtn', !value]].forEach(([id, active]) => {
        const btn = document.getElementById(id);
        btn.className = 'flex-1 px-2 py-2 text-sm font-medium ' + (active ? 'bg-cyan-600 text-white' : 'bg-teal-700 text-slate-200');
        btn.setAttribute('aria-pressed', String(active));
      });
      render();
    }

    function render() {
      renderStats();
      renderExtraMetrics();
      renderCharts();
      renderLegend();
      renderHeatmaps();
    }

    function renderStats() {
      const activityCount = allData.activities.filter(a => selectedYears.has(a.year) && selectedTypes.has(a.type)).length;
      const totalDistance = sumAggregates(selectedYears, selectedTypes).distance;

      const container = document.getElementById('statsContainer');

      container.innerHTML = `
        <div class="bg-teal-900 p-4 rounded-lg border border-teal-700">
          <p class="text-slate-200 text-xs uppercase mb-1">Aktivity</p>
          <p class="text-3xl font-bold text-cyan-400">${activityCount.toLocaleString('cs-CZ')}</p>
        </div>
        <div class="bg-teal-900 p-4 rounded-lg border border-teal-700">
          <p class="text-slate-200 text-xs uppercase mb-1">Aktivní dny</p>
          <p class="text-3xl font-bold text-cyan-400">${new Set(allData.activities.filter(a => selectedYears.has(a.year) && selectedTypes.has(a.type)).map(a => a.date)).size.toLocaleString('cs-CZ')}</p>
        </div>
        <div class="bg-teal-900 p-4 rounded-lg border border-teal-700">
          <p class="text-slate-200 text-xs uppercase mb-1">Let</p>
          <p class="text-3xl font-bold text-cyan-400">${allData.years.filter(y => selectedYears.has(y)).length.toLocaleString('cs-CZ')}</p>
        </div>
        <div class="bg-teal-900 p-4 rounded-lg border border-teal-700">
          <p class="text-slate-200 text-xs uppercase mb-1">Typů</p>
          <p class="text-3xl font-bold text-cyan-400">${allData.types.filter(t => selectedTypes.has(t)).length.toLocaleString('cs-CZ')}</p>
        </div>
        <div class="bg-teal-900 p-4 rounded-lg border border-teal-700">
          <p class="text-slate-200 text-xs uppercase mb-1">Km</p>
          <p class="text-3xl font-bold text-cyan-400">${Math.round(totalDistance / 1000).toLocaleString('cs-CZ')}</p>
        </div>
      `;
    }

    function renderExtraMetrics() {
      const container = document.getElementById('extraMetrics');
      const filteredActs = allData.activities.filter(a => selectedYears.has(a.year) && selectedTypes.has(a.type));

      // 1) NEJDELŠÍ SÉRIE
      const dates = [...new Set(filteredActs.map(a => a.date))].sort();
      let maxStreak = 0, curStreak = 0, maxStart = '';
      let curStart = '';
      for (let i = 0; i < dates.length; i++) {
        const prev = i > 0 ? new Date(dates[i-1] + 'T00:00:00Z') : null;
        const cur = new Date(dates[i] + 'T00:00:00Z');
        if (prev && (cur - prev) === 86400000) { curStreak++; }
        else { curStreak = 1; curStart = dates[i]; }
        if (curStreak > maxStreak) { maxStreak = curStreak; maxStart = curStart; }
      }

      // 2) SROVNÁNÍ S LOŇSKEM - správně filtrováno dle selectedTypes
      const thisYear = new Date().getFullYear();
      const lastYear = thisYear - 1;
      const today = new Date();
      const todayMD = String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
      let thisYearKm = 0, lastYearKm = 0;
      allData.activities.forEach(act => {
        if (!selectedTypes.has(act.type)) return; // filtr dle vybraných typů
        const agg = allData.aggregates[String(act.year)]?.[act.type]?.[act.date];
        const dist = agg ? (agg.distance || 0) : 0;
        const actMD = act.date.substring(5);
        if (act.year === thisYear && actMD <= todayMD) thisYearKm += dist;
        if (act.year === lastYear && actMD <= todayMD) lastYearKm += dist;
      });
      // Deduplikace - každý den+typ počítej jen jednou
      const seenThisYear = new Set(), seenLastYear = new Set();
      thisYearKm = 0; lastYearKm = 0;
      allData.activities.forEach(act => {
        if (!selectedTypes.has(act.type)) return;
        const key = act.year + '-' + act.type + '-' + act.date;
        const agg = allData.aggregates[String(act.year)]?.[act.type]?.[act.date];
        const dist = agg ? (agg.distance || 0) : 0;
        const actMD = act.date.substring(5);
        if (act.year === thisYear && actMD <= todayMD && !seenThisYear.has(key)) { thisYearKm += dist; seenThisYear.add(key); }
        if (act.year === lastYear && actMD <= todayMD && !seenLastYear.has(key)) { lastYearKm += dist; seenLastYear.add(key); }
      });
      const diff = thisYearKm - lastYearKm;
      const diffPct = lastYearKm > 0 ? ((diff / lastYearKm) * 100).toFixed(0) : '—';
      const diffColor = diff >= 0 ? 'text-green-400' : 'text-red-400';
      const diffSign = diff >= 0 ? '+' : '';

      // 3) PRŮMĚR NA AKTIVITU
      const { count: actCount, distance: totalDist, elevation_gain: totalElev, moving_time: totalTime } =
        sumAggregates(selectedYears, selectedTypes);
      const avgKm = actCount > 0 ? formatDecimal(totalDist / actCount / 1000) : '—';
      const avgElev = actCount > 0 ? Math.round(totalElev / actCount).toLocaleString('cs-CZ') : '—';
      const avgMin = actCount > 0 ? Math.round(totalTime / actCount / 60) : '—';

      container.innerHTML = `
        <div class="stat-card bg-teal-900 rounded-lg border border-teal-700 p-4">
          <p class="text-xs text-slate-200 uppercase mb-1">🔥 Nejdelší série</p>
          <p class="text-3xl font-bold text-orange-400">${maxStreak} ${plural(maxStreak, 'den', 'dny', 'dní')}</p>
          <p class="text-xs text-slate-300 mt-1">${maxStart ? 'od ' + formatDate(maxStart) : '—'}</p>
        </div>
        <div class="stat-card bg-teal-900 rounded-lg border border-teal-700 p-4">
          <p class="text-xs text-slate-200 uppercase mb-1">📊 vs. loňský rok (ke dnešku)</p>
          <p class="text-3xl font-bold ${diffColor}">${diffSign}${Math.round(diff / 1000).toLocaleString('cs-CZ')} km</p>
          <p class="text-xs text-slate-300 mt-1">${thisYear}: ${Math.round(thisYearKm / 1000).toLocaleString('cs-CZ')} km &nbsp;vs&nbsp; ${lastYear}: ${Math.round(lastYearKm / 1000).toLocaleString('cs-CZ')} km (${diffSign}${diffPct} %)</p>
        </div>
        <div class="stat-card bg-teal-900 rounded-lg border border-teal-700 p-4">
          <p class="text-xs text-slate-200 uppercase mb-1">📐 Průměr na aktivitu</p>
          <div class="flex gap-4 mt-2">
            <div><p class="text-xl font-bold text-cyan-400">${avgKm} km</p><p class="text-xs text-slate-300">vzdálenost</p></div>
            <div><p class="text-xl font-bold text-amber-400">${avgElev} m</p><p class="text-xs text-slate-300">převýšení</p></div>
            <div><p class="text-xl font-bold text-green-400">${avgMin} min</p><p class="text-xs text-slate-300">čas</p></div>
          </div>
        </div>`;
    }

    function renderCharts() {
      const chartH = 88;
      const monthNames = ['Led','Úno','Bře','Dub','Kvě','Čer','Čvc','Srp','Zář','Říj','Lis','Pro'];
      const activeDates = [...new Set(allData.activities
        .filter(a => selectedYears.has(a.year) && selectedTypes.has(a.type))
        .map(a => a.date))];

      const monthCounts = new Array(12).fill(0);
      activeDates.forEach(date => {
        const m = parseInt(date.substring(5, 7)) - 1;
        monthCounts[m]++;
      });
      const maxMonth = Math.max(...monthCounts, 1);
      document.getElementById('monthBarChart').innerHTML = monthCounts.map((v, i) => {
        const h = Math.max(2, Math.round((v / maxMonth) * chartH));
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:${chartH}px;" title="${monthNames[i]}: ${v}">
          <div style="width:100%;height:${h}px;background:${v === maxMonth ? '#22d3ee' : '#0f766e'};border-radius:3px 3px 0 0;"></div>
        </div>`;
      }).join('');
      document.getElementById('monthLabels').innerHTML = monthCounts.map((v, i) =>
        `<span style="flex:1;text-align:center;font-size:11px;color:${v === maxMonth ? '#67e8f9' : '#94a3b8'};font-weight:${v === maxMonth ? 'bold' : 'normal'}">${monthNames[i]}</span>`
      ).join('');

      const dayNames = ['Po','Út','St','Čt','Pá','So','Ne'];
      const dayJsValues = [1, 2, 3, 4, 5, 6, 0];
      const dayCounts = new Array(7).fill(0);
      activeDates.forEach(date => {
        const d = new Date(date + 'T00:00:00Z').getUTCDay();
        const idx = dayJsValues.indexOf(d);
        if (idx >= 0) dayCounts[idx]++;
      });
      const maxDay = Math.max(...dayCounts, 1);
      document.getElementById('weekdayBarChart').innerHTML = dayCounts.map((v, i) => {
        const h = Math.max(2, Math.round((v / maxDay) * chartH));
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:${chartH}px;" title="${dayNames[i]}: ${v}">
          <div style="width:100%;height:${h}px;background:${v === maxDay ? '#f59e0b' : '#0f766e'};border-radius:3px 3px 0 0;"></div>
        </div>`;
      }).join('');
      document.getElementById('weekdayLabels').innerHTML = dayCounts.map((v, i) =>
        `<span style="flex:1;text-align:center;font-size:11px;color:${v === maxDay ? '#fcd34d' : '#94a3b8'};font-weight:${v === maxDay ? 'bold' : 'normal'}">${dayNames[i]}</span>`
      ).join('');
    }

    function dayCell(year, dateStr, dayData) {
      if (!dayData) {
        return showAllDays
          ? '<div class="cell" style="background-color: #4b5563; opacity: 0.2"></div>'
          : '<div class="cell-gap"></div>';
      }
      const yearAgg = allData.aggregates[String(year)] || {};
      const ids = new Set();
      dayData.forEach(type => (yearAgg[type]?.[dateStr]?.activity_ids || []).forEach(id => ids.add(id)));
      const opacity = Math.min(0.3 + (dayData.length / 3) * 0.7, 1);
      const names = [...new Set(dayData)].map(typeName).join(', ');
      return '<div class="cell" style="background-color: ' + typeColor(dayData[0]) + '; opacity: ' + opacity + '"' +
        ' title="' + formatDate(dateStr) + ': ' + names + '" data-activities="' + [...ids].join(',') + '"></div>';
    }

    // Měsíc jako mřížka: sloupce jsou týdny, řádky Pondělí až Neděle
    function monthGrid(year, monthIndex, dayMap) {
      const offset = (new Date(year, monthIndex, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const slots = Math.ceil((offset + daysInMonth) / 7) * 7;
      const now = new Date();
      let html = '';
      for (let slot = 0; slot < slots; slot++) {
        const day = slot - offset + 1;
        if (day < 1 || day > daysInMonth || new Date(year, monthIndex, day) > now) {
          html += '<div class="cell-gap"></div>';
          continue;
        }
        const dateStr = `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        html += dayCell(year, dateStr, dayMap[dateStr]);
      }
      return '<div class="month-grid">' + html + '</div>';
    }

    function renderHeatmaps() {
      const container = document.getElementById('heatmapsContainer');
      const years = [...selectedYears].sort((a, b) => b - a);

      if (years.length === 0) {
        container.innerHTML = '<p class="text-slate-200 text-center py-8">Žádná data podle filtrů</p>';
        return;
      }

      container.innerHTML = years.map(year => {
        const totals = sumAggregates([year], selectedTypes);
        const dayMap = {};
        allData.activities.filter(a => a.year === year && selectedTypes.has(a.type)).forEach(act => {
          if (!dayMap[act.date]) dayMap[act.date] = [];
          dayMap[act.date].push(act.type);
        });

        const activeDays = Object.keys(dayMap).length;
        const activeMonths = new Set(Object.keys(dayMap).map(date => Number(date.substring(5, 7)) - 1));
        const isCurrent = year === new Date().getFullYear();
        const periodDays = isCurrent ? Math.floor((new Date() - new Date(year, 0, 1)) / 86400000) + 1 : 365;
        const share = Math.round(activeDays / periodDays * 100) + ' % ' + (isCurrent ? 'k dnešku' : 'roku');

        return `
          <div>
            <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
              <div>
                <h2 class="text-2xl font-bold text-white mb-2">${year}</h2>
                <p class="text-xs text-slate-100 uppercase mb-1">📅 Aktivní dny</p>
                <p class="text-xl font-bold text-cyan-400">${formatNumber(activeDays)}</p>
                <p class="text-xs text-slate-200 mt-1">${share}</p>
              </div>
              <div class="flex gap-6 text-right">
                <div>
                  <p class="text-xs text-slate-100 uppercase mb-1">🏔️ Výška</p>
                  <p class="text-2xl font-bold text-amber-400">${formatNumber(totals.elevation_gain)} m</p>
                </div>
                <div>
                  <p class="text-xs text-slate-100 uppercase mb-1">📍 Vzdálenost</p>
                  <p class="text-2xl font-bold text-cyan-400">${formatNumber(totals.distance / 1000)} km</p>
                </div>
                <div>
                  <p class="text-xs text-slate-100 uppercase mb-1">⏱️ Čas</p>
                  <p class="text-2xl font-bold text-green-400">${formatNumber(totals.moving_time / 3600)} h</p>
                </div>
              </div>
            </div>
            ${pastGoalHtml(year)}
            <div class="overflow-x-auto pb-2 mb-8">
              <div class="flex gap-1.5 w-max">
                <div class="w-16 shrink-0">
                  <div class="h-5"></div>
                  <div style="display:grid;grid-template-rows:repeat(7,14px);gap:2px;">
                    ${WEEKDAYS.map(dayName => '<span class="text-xs text-slate-100" style="line-height:14px">' + dayName + '</span>').join('')}
                  </div>
                </div>
                ${MONTHS.map((month, monthIndex) => activeMonths.has(monthIndex)
                  ? '<div><p class="h-5 text-xs text-slate-100 text-center">' + month + '</p>' + monthGrid(year, monthIndex, dayMap) + '</div>'
                  : '').join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Event listenery na čtvereččky
      setTimeout(() => {
        document.querySelectorAll('.cell').forEach(cell => {
          cell.addEventListener('click', (e) => {
            const activities = cell.dataset.activities.split(',').filter(Boolean);
            if (activities.length === 0) return;
            
            if (activities.length === 1) {
              window.open(`https://www.strava.com/activities/${activities[0]}`, '_blank');
            } else {
              showActivityMenu(e, activities);
            }
          });
        });
      }, 0);
    }

    function showActivityMenu(e, activityIds) {
      // Smaž staré menu
      const oldMenu = document.querySelector('.activity-menu');
      if (oldMenu) oldMenu.remove();
      
      const menu = document.createElement('div');
      menu.className = 'activity-menu';
      menu.style.left = (e.clientX) + 'px';
      menu.style.top = (e.clientY) + 'px';
      
      menu.innerHTML = activityIds.map((id, idx) => `
        <div class="activity-menu-item" onclick="window.open('https://www.strava.com/activities/${id}', '_blank'); this.closest('.activity-menu').remove();">
          Aktivita ${idx + 1}
        </div>
      `).join('');
      
      document.body.appendChild(menu);
      
      // Zavřít menu při kliknutí jinde
      setTimeout(() => {
        document.addEventListener('click', function closeMenu(e) {
          if (!e.target.closest('.activity-menu') && !e.target.closest('.cell')) {
            menu.remove();
            document.removeEventListener('click', closeMenu);
          }
        });
      }, 0);
    }

    init();
  </script>
</body>
</html>
